---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="post-meta">
      {{ page.date | date: "%Y-%m-%d" }}
      {% if page.tags %}
        &nbsp;·&nbsp;
        {% for tag in page.tags %}
          {{ tag }}{% unless forloop.last %}, {% endunless %}
        {% endfor %}
      {% endif %}
    </p>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
