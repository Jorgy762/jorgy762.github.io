<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="brassard"></div>

  <nav class="site-nav" aria-label="Primary navigation">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="nav-logo">
        <span class="nav-logo-main">ThreatVector<span style="color:var(--brown);">762</span></span>
        <span class="nav-logo-sub">// Jorgy762</span>
      </a>
      <ul class="nav-links" id="nav-links">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active" aria-current="page"{% endif %}>Home</a></li>
        <li><a href="{{ '/projects' | relative_url }}" {% if page.url contains 'projects' %}class="active" aria-current="page"{% endif %}>Projects</a></li>
        <li><a href="{{ '/blog' | relative_url }}" {% if page.url contains 'blog' %}class="active" aria-current="page"{% endif %}>Field Notes</a></li>
        <li><a href="{{ '/certs' | relative_url }}" {% if page.url contains 'certs' %}class="active" aria-current="page"{% endif %}>Certs</a></li>
        <li><a href="{{ '/gaming' | relative_url }}" {% if page.url contains 'gaming' %}class="active" aria-current="page"{% endif %}>Gaming</a></li>
        <li><a href="{{ '/contact' | relative_url }}" {% if page.url contains 'contact' %}class="active" aria-current="page"{% endif %}>Contact</a></li>
      </ul>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-links">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <div class="op-bar" aria-label="Operational status">
    <div class="container">
      <div class="op-field"><span class="op-dot" aria-hidden="true">●</span><b>STATUS</b> OPERATIONAL</div>
      <div class="op-field"><b>SECTOR</b> CAN-AB-CGY</div>
      <div class="op-field"><b>UNIT</b> CAF/MP</div>
      <div class="op-field"><b>DTG</b> {{ site.time | date: "%Y-%m-%d" }}</div>
    </div>
  </div>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      {% include copyright.html %}
      <div class="footer-links">
        <a href="https://github.com/Jorgy762" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com/in/rjorg762/" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </footer>

  <div class="brassard"></div>

<script>
  const toggle = document.getElementById('nav-toggle');
  const links  = document.getElementById('nav-links');
  toggle.addEventListener('click', () => {
    const isOpen = toggle.classList.toggle('open');
    links.classList.toggle('open');
    toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  links.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      toggle.classList.remove('open');
      links.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  });
</script>
</body>
</html>
